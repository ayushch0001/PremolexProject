<div class="min-h-screen flex bg-[#F9FAFB] text-on-surface font-body-lg">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-surface-container-lowest border-r border-outline-variant flex flex-col fixed h-full z-10">
        <div class="h-16 flex items-center px-6 border-b border-outline-variant">
            <div class="font-headline-md text-headline-md font-bold text-primary">Premolex Admin</div>
        </div>

        <nav class="flex-1 p-4 space-y-2">
            <button (click)="setView('dashboard')" [class.bg-secondary-container]="activeView() === 'dashboard'"
                [class.text-on-secondary-container]="activeView() === 'dashboard'"
                class="w-full flex items-center gap-3 px-4 py-3 rounded text-left font-label-md hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">dashboard</span> Overview
            </button>

            <button (click)="setView('productsForm')" [class.bg-secondary-container]="activeView() === 'productsForm'"
                [class.text-on-secondary-container]="activeView() === 'productsForm'"
                class="w-full flex items-center gap-3 px-4 py-3 rounded text-left font-label-md hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">inventory_2</span> Manage Products
            </button>

            <button (click)="setView('categories')" [class.bg-secondary-container]="activeView() === 'categories'"
                [class.text-on-secondary-container]="activeView() === 'categories'"
                class="w-full flex items-center gap-3 px-4 py-3 rounded text-left font-label-md hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">category</span> Categories
            </button>

            <button (click)="setView('blogs')" [class.bg-secondary-container]="activeView() === 'blogs'"
                [class.text-on-secondary-container]="activeView() === 'blogs'"
                class="w-full flex items-center gap-3 px-4 py-3 rounded text-left font-label-md hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">article</span> Blog Posts
            </button>

            <button (click)="setView('handlers')" [class.bg-secondary-container]="activeView() === 'handlers'"
                [class.text-on-secondary-container]="activeView() === 'handlers'"
                class="w-full flex items-center gap-3 px-4 py-3 rounded text-left font-label-md hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">manage_accounts</span> Handlers
            </button>
        </nav>

        <div class="p-4 border-t border-outline-variant">
            <button
                class="w-full flex items-center gap-3 px-4 py-2 text-error font-label-md hover:bg-error-container rounded transition-colors">
                <span class="material-symbols-outlined">logout</span> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 ml-64 p-lg">
        @switch (activeView()) {
        @case ('dashboard') {
       <app-dashboard-overview></app-dashboard-overview>
        }
        @case ('productsForm') {
        <app-product-form></app-product-form>
        }
        @case ('categories') {
        <app-category-form></app-category-form>
        }
        @case ('blogs') {
        <app-blog-form></app-blog-form>
        }
        @case ('handlers') {
        <app-handler-form></app-handler-form>
        }
        }
    </main>
</div>
