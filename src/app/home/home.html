<main class="flex-grow">

    <!-- Hero Carousel -->
    <app-hero-carousel></app-hero-carousel>
    
    <!-- Corporate Values (Mission, Vision, Values) -->
    <app-corporate-values [cards]="valueCards"></app-corporate-values>
    
    <!-- Home About Section (Company History) -->
    <app-home-about></app-home-about>
    
    <!-- Applications Grid (Features of HDPE Pipe) -->
    <app-applications-grid></app-applications-grid>

    <!-- Dashboard Quick Stats -->
    <section class="py-xl px-gutter max-w-container-max mx-auto mt-16 relative z-30">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-sm">
            <div *ngFor="let stat of stats"
                class="bg-surface-container-lowest border border-outline-variant p-md rounded shadow-lg hover:shadow-xl transition-shadow duration-300">
                <div class="flex items-center gap-sm">
                    <div class="bg-primary/10 p-xs rounded-full">
                        <span class="material-symbols-outlined text-primary text-3xl">{{ stat.icon }}</span>
                    </div>
                    <div>
                        <p class="font-headline-md text-headline-md text-on-surface font-bold">{{ stat.value }}</p>
                        <p class="font-label-sm text-label-sm text-on-surface-variant">{{ stat.label }}</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <app-about></app-about>

    <!-- Dashboard Performance Cards -->
    <section class="py-xl px-gutter max-w-container-max mx-auto">
        <div class="flex justify-between items-center mb-lg">
            <div>
                <h2 class="font-headline-lg text-headline-lg text-primary">Performance Overview</h2>
                <p class="font-body-md text-body-md text-on-surface-variant mt-xs">Real-time metrics and insights
                </p>
            </div>
            <button
                class="bg-primary text-on-primary font-label-md text-label-md px-md py-sm rounded hover:bg-primary-container hover:text-on-primary-container transition-colors">
                View All Stats
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-md">
            <div *ngFor="let pStat of productStats; let i = index"
                class="bg-surface-container-lowest border border-outline-variant p-md rounded hover:shadow-lg transition-all duration-300 cursor-pointer"
                (click)="onCardClick('stat-' + pStat.label)">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant">{{ pStat.label }}</p>
                        <p class="font-headline-md text-headline-md text-on-surface font-bold mt-xs">
                            {{ pStat.value }}</p>
                    </div>
                    <span class="text-green-600 text-sm font-medium" *ngIf="pStat.trend === 'up'">
                        {{ pStat.change }}
                    </span>
                </div>
                <div class="mt-sm w-full h-1 bg-surface-container rounded-full overflow-hidden">
                    <div class="h-full bg-primary rounded-full" [style.width.%]="productStats[i]"></div>
                </div>
            </div>
        </div>
        </section>

    <!-- Products Section -->
    <app-products></app-products>

    <!-- Latest News & Updates (Blog Section) -->
    <app-home-blog-section></app-home-blog-section>

    <!-- Project Gallery (Portfolio) -->
    <app-project-gallery></app-project-gallery>



    <!-- Contact CTA (Lead Generation Form) -->
    <app-home-contact-cta></app-home-contact-cta>



</main>
