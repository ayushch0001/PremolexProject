<header class="w-full sticky top-0 z-50 bg-white transition-all duration-300"
        [class.shadow-md]="isScrolled">
  <div class="max-w-container-max mx-auto px-gutter">
    <div class="flex items-center justify-between h-16 lg:h-20">
      <!-- Logo -->
      <a routerLink="/Home" class="flex items-center gap-2 group">
        <div class="w-10 h-10 lg:w-12 lg:h-12 bg-[#0A2540] rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-lg lg:text-xl">P</span>
        </div>
        <div class="flex flex-col">
          <span class="font-headline-md text-headline-md font-bold text-[#0A2540] leading-tight">Premolex</span>
          <span class="text-[10px] lg:text-xs text-[#FF6B00] font-medium tracking-widest uppercase -mt-1">Industries</span>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex items-center gap-1">
        <ng-container *ngFor="let item of navItems">
          <!-- Nav Item with Dropdown -->
          <div *ngIf="item.hasDropdown" class="relative"
               (mouseenter)="openDropdown = item.label"
               (mouseleave)="openDropdown = null">
            <a [routerLink]="item.path"
               routerLinkActive="active-link"
               [routerLinkActiveOptions]="{exact: true}"
               class="nav-link px-3 py-2 text-sm font-medium text-[#0A2540] hover:text-[#FF6B00] transition-colors duration-200 rounded-md flex items-center gap-1"
               (click)="toggleDropdown(item.label)">
              {{ item.label }}
              <span class="material-symbols-outlined text-[18px] transition-transform duration-200"
                    [class.rotate-180]="openDropdown === item.label">expand_more</span>
            </a>
            <!-- Dropdown Menu -->
            <div *ngIf="openDropdown === item.label"
                 class="dropdown-menu absolute top-full left-0 mt-1 w-56 bg-white rounded-lg shadow-xl border border-gray-100 py-2 z-50">
              <a *ngFor="let child of item.children"
                 [routerLink]="child.path"
                 class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-[#FFF5EB] hover:text-[#FF6B00] transition-colors duration-150"
                 (click)="closeDropdown()">
                {{ child.label }}
              </a>
            </div>
          </div>

          <!-- Regular Nav Item -->
          <a *ngIf="!item.hasDropdown"
             [routerLink]="item.path"
             routerLinkActive="active-link"
             [routerLinkActiveOptions]="{exact: true}"
             class="nav-link px-3 py-2 text-sm font-medium text-[#0A2540] hover:text-[#FF6B00] transition-colors duration-200 rounded-md">
            {{ item.label }}
          </a>
        </ng-container>
      </nav>

      <!-- Mobile Hamburger Button -->
      <button class="lg:hidden flex items-center justify-center w-10 h-10 rounded-lg text-[#0A2540] hover:bg-gray-100 transition-colors"
              (click)="toggleMobileMenu()"
              aria-label="Toggle menu">
        <span class="material-symbols-outlined text-2xl">
          {{ isMobileMenuOpen ? 'close' : 'menu' }}
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Side Drawer Overlay -->
  <div *ngIf="isMobileMenuOpen"
       class="fixed inset-0 bg-black/50 z-40 lg:hidden"
       (click)="closeMobileMenu()">
  </div>

  <!-- Mobile Side Drawer -->
  <div *ngIf="isMobileMenuOpen"
       class="fixed top-0 right-0 h-full w-72 bg-white z-50 shadow-2xl lg:hidden overflow-y-auto transform transition-transform duration-300">
    <div class="p-4">
      <!-- Mobile Logo -->
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
        <a routerLink="/Home" class="flex items-center gap-2" (click)="closeMobileMenu()">
          <div class="w-9 h-9 bg-[#0A2540] rounded-lg flex items-center justify-center">
            <span class="text-white font-bold">P</span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-[#0A2540] leading-tight">Premolex</span>
            <span class="text-[10px] text-[#FF6B00] font-medium tracking-widest uppercase -mt-1">Industries</span>
          </div>
        </a>
        <button class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100"
                (click)="closeMobileMenu()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Mobile Navigation -->
      <nav class="flex flex-col gap-1">
        <ng-container *ngFor="let item of navItems">
          <!-- Mobile Dropdown Item -->
          <div *ngIf="item.hasDropdown">
            <button class="w-full flex items-center justify-between px-3 py-3 text-sm font-medium text-[#0A2540] hover:bg-[#FFF5EB] hover:text-[#FF6B00] rounded-lg transition-colors"
                    (click)="toggleDropdown(item.label)">
              {{ item.label }}
              <span class="material-symbols-outlined text-[18px] transition-transform duration-200"
                    [class.rotate-180]="openDropdown === item.label">expand_more</span>
            </button>
            <div *ngIf="openDropdown === item.label" class="ml-4 space-y-1 mb-2">
              <a *ngFor="let child of item.children"
                 [routerLink]="child.path"
                 class="block px-3 py-2.5 text-sm text-gray-600 hover:bg-[#FFF5EB] hover:text-[#FF6B00] rounded-lg transition-colors"
                 (click)="closeMobileMenu()">
                {{ child.label }}
              </a>
            </div>
          </div>

          <!-- Mobile Regular Item -->
          <a *ngIf="!item.hasDropdown"
             [routerLink]="item.path"
             routerLinkActive="active-link mobile-link"
             class="px-3 py-3 text-sm font-medium text-[#0A2540] hover:bg-[#FFF5EB] hover:text-[#FF6B00] rounded-lg transition-colors"
             (click)="closeMobileMenu()">
            {{ item.label }}
          </a>
        </ng-container>
      </nav>

      <!-- Mobile Contact Info -->
      <div class="mt-6 pt-4 border-t border-gray-100">
        <div class="flex flex-col gap-2 px-3">
          <a href="tel:+918817409880" class="flex items-center gap-2 text-sm text-gray-600 hover:text-[#FF6B00] transition-colors">
            <span class="material-symbols-outlined text-[18px]">phone</span>
            +91-8817409880
          </a>
          <a href="mailto:premindustries8@gmail.com" class="flex items-center gap-2 text-sm text-gray-600 hover:text-[#FF6B00] transition-colors">
            <span class="material-symbols-outlined text-[18px]">mail</span>
            premindustries8@gmail.com
          </a>
          <div class="flex items-center gap-2 text-sm text-gray-600">
            <span class="material-symbols-outlined text-[18px]">location_on</span>
            Raipur, C.G
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
