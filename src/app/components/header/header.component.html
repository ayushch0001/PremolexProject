<header class="w-full top-0 sticky z-50 bg-surface-container-lowest dark:bg-surface-dim border-b border-outline-variant dark:border-outline">
  <div class="flex justify-between items-center h-16 px-gutter max-w-container-max mx-auto">
    <div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">
      <a href="/Home"> Premolex Industries </a>
    </div>
    
    <nav class="hidden md:flex gap-gutter">
      <a *ngFor="let item of navItems" 
         class="font-label-md text-label-md text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors duration-200 ease-in-out" 
         href="/{{ item }}">
        {{ item }}
      </a>
    </nav>
    
    <div class="flex items-center gap-sm">
      <button class="hidden md:flex items-center justify-center p-xs text-secondary hover:text-primary transition-colors">
        <span class="material-symbols-outlined">search</span>
      </button>
      <button class="bg-primary text-on-primary font-label-md text-label-md px-sm py-xs rounded hover:bg-primary-container hover:text-on-primary-container transition-colors duration-200 ease-in-out">
        Request Quote
      </button>
    </div>
  </div>
</header>
