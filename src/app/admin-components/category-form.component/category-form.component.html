<div class="w-full min-h-[80vh] flex items-center justify-center p-gutter">
    <div class="w-full max-w-2xl bg-surface-container-lowest border border-outline-variant rounded p-lg shadow-sm">
        <h2 class="font-headline-lg mb-md pb-xs border-b border-outline-variant">Create Category</h2>

        <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="space-y-sm">
            <div>
                <label class="font-label-sm text-secondary uppercase block mb-1">Category Name</label>
                <input formControlName="name" type="text"
                    class="w-full border border-outline-variant rounded p-2 focus:ring-1 focus:ring-primary"
                    placeholder="e.g. Industrial Valves" />
                </div>

            <div>
                <label class="font-label-sm text-secondary uppercase block mb-1">Description</label>
                <textarea formControlName="description" rows="2"
                    class="w-full border border-outline-variant rounded p-2 focus:ring-1 focus:ring-primary"
                    placeholder="Brief category description..."></textarea>
                </div>

            <div class="pt-md flex justify-end">
                <button type="submit" [disabled]="categoryForm.invalid || isSubmitting"
                    class="bg-primary text-on-primary px-6 py-2 rounded font-label-md disabled:opacity-50 hover:bg-on-primary-fixed-variant transition-colors">
                    {{ isSubmitting ? 'Creating...' : 'Create Category' }}
                    </button>
                    </div>
                    </form>
    </div>
</div>
